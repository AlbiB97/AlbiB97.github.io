<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lavorare con l'AI: Prompting Efficace e Sicuro — Minigioco Didattico | Alberto Bedeschi</title>
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    :root {
      --bg-dark: #121614;
      --bg-card: #1b221f;
      --bg-surface: #26302b;
      --primary: #2a5c45;
      --primary-light: #3b7a5d;
      --terra: #c86441;
      --gold: #eab308;
      --success: #10b981;
      --danger: #ef4444;
      --text-main: #faf8f4;
      --text-muted: #b5bdb8;
      --border: rgba(255, 255, 255, 0.12);
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at top, #1f352b 0%, #121614 75%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }
    .game-shell {
      width: 100%;
      max-width: 460px;
      min-height: 540px;
      background: var(--bg-card);
      border-radius: 22px;
      border: 1px solid var(--border);
      box-shadow: 0 20px 50px rgba(0,0,0,0.45);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .topbar {
      padding: 12px 16px;
      background: rgba(18, 22, 20, 0.85);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      gap: 8px;
      flex-wrap: wrap;
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .level-pill {
      background: rgba(42, 92, 69, 0.35);
      border: 1px solid rgba(59, 122, 93, 0.6);
      color: #a7f3d0;
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.75rem;
    }
    .score-pill {
      background: rgba(234, 179, 8, 0.15);
      color: #fde047;
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.78rem;
    }
    .lives-pill {
      font-size: 0.82rem;
      letter-spacing: 1px;
    }
    .jump-select {
      background: var(--bg-surface);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px 6px;
      font-size: 0.72rem;
      cursor: pointer;
    }
    .progress-bar-wrap {
      height: 4px;
      background: rgba(255,255,255,0.08);
      width: 100%;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #3b7a5d, #c86441);
      width: 0%;
      transition: width 0.25s ease;
    }
    .screen {
      flex: 1;
      padding: 20px 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
    }
    .type-tag {
      display: inline-block;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.9px;
      color: #e09f87;
      font-weight: 700;
      margin-bottom: 6px;
    }
    h1, h2 {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 8px;
      font-size: 1.15rem;
    }
    p, li {
      font-size: 0.92rem;
      line-height: 1.55;
      color: #e5e7eb;
    }
    ul { padding-left: 18px; margin: 8px 0; }
    li { margin-bottom: 5px; }
    .card-box {
      background: rgba(18, 22, 20, 0.55);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
    }
    .hero-ill {
      width: 100%;
      height: 110px;
      border-radius: 14px;
      background: linear-gradient(135deg, #2a5c45 0%, #1e3f30 55%, #8f3e24 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      margin-bottom: 12px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.15s ease;
      background: var(--primary-light);
      color: white;
    }
    .btn:hover { background: var(--primary); }
    .btn:active { transform: scale(0.98); }
    .btn-secondary {
      background: var(--bg-surface);
      color: var(--text-main);
      border: 1px solid var(--border);
    }
    .btn-outline {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      color: var(--text-main);
      text-align: left;
      font-weight: 500;
      margin-bottom: 8px;
      line-height: 1.4;
    }
    .btn-outline:hover {
      border-color: #6ee7b7;
      background: rgba(42, 92, 69, 0.25);
    }
    .tinder-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 8px;
    }
    .btn-true { background: #059669; }
    .btn-false { background: #dc2626; }
    .letter-slots, .letter-bank {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin: 10px 0;
    }
    .slot, .tile {
      width: 34px;
      height: 40px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1rem;
      user-select: none;
    }
    .slot {
      background: rgba(18,22,20,0.85);
      border: 2px dashed rgba(255,255,255,0.25);
      color: #fde047;
    }
    .tile {
      background: var(--bg-surface);
      border: 1px solid rgba(255,255,255,0.2);
      cursor: pointer;
      color: white;
    }
    .tile.used { opacity: 0.22; pointer-events: none; }
    .seq-item {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 7px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.84rem;
    }
    .seq-controls button {
      background: rgba(18,22,20,0.8);
      border: 1px solid var(--border);
      color: white;
      border-radius: 6px;
      padding: 4px 8px;
      cursor: pointer;
      margin-left: 3px;
    }
    .feedback-box {
      padding: 13px;
      border-radius: 12px;
      margin-top: 10px;
      font-size: 0.86rem;
      line-height: 1.48;
    }
    .feedback-ok {
      background: rgba(16, 185, 129, 0.16);
      border: 1px solid var(--success);
    }
    .feedback-err {
      background: rgba(239, 68, 68, 0.16);
      border: 1px solid var(--danger);
    }
    textarea {
      width: 100%;
      min-height: 100px;
      border-radius: 10px;
      background: rgba(18,22,20,0.85);
      border: 1px solid var(--border);
      color: white;
      padding: 10px;
      font-family: inherit;
      font-size: 0.88rem;
      resize: vertical;
      margin-top: 8px;
    }
    .cw-row { margin-bottom: 9px; }
    .cw-row input {
      width: 100%;
      margin-top: 4px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(18,22,20,0.9);
      color: #fde047;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      font-size: 0.85rem;
    }
  </style>
</head>

    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
    <div class="screen" id="screen"></div>
  </div>

          "Spesso le risposte dell'AI sembrano generiche, imprecise o \"robotiche\".<br/><br/>E, ancora più importante, basta condividere l'informazione sbagliata in chat per mettere a rischio <strong>dati aziendali riservati</strong>…",

        options: [
          "“Carico direttamente i tre PDF originali su un sito gratuito trovato online che confronta i documenti in automatico: l'importante è finire entro stasera!”",
          "“Uso l'assistente AI aziendale approvato, incollando solo i dati tecnici ed economici anonimizzati (Fornitore A, B e C) e chiedendo una tabella basata solo sul testo fornito.”",
          "“Chiedo all'AI pubblica senza allegare nulla: 'Dimmi tu quali sono i tre migliori fornitori sul mercato e quanto costano', fidandomi dei prezzi che mi scrive.”"
        ],
        correctIndex: 1,
        feedback: "<strong>Proteggere la riservatezza e ottenere un ottimo risultato</strong> vanno di pari passo!<br/>Usando lo strumento aziendale su dati anonimizzati (Fornitore A, B e C) e vincolando l'AI al testo fornito, Andrea ottiene la tabella in pochi minuti senza esporre dati riservati su siti esterni e senza rischiare prezzi inventati dall'AI."
      },
      {
        level: 3, levelName: "3° Liv · Mettiti alla prova!", type: "tip",
        text: "Bene! Sei pronto per una prova ancora più sfidante?<br/><br/>Nel prossimo caso dovrai scrivere tu stesso un prompt efficace per l'AI. Stavolta non avrai alternative di risposta prestabilite: usa i <strong>4 mattoni (Contesto, Ruolo, Formato, Vincoli)</strong> e scrivi direttamente la tua richiesta!"
      },
      {
        level: 3, levelName: "3° Liv · Mettiti alla prova!", type: "open-ai",
        question: "Devi inviare una mail a tutto il tuo team per invitarli a un corso di aggiornamento di 2 ore previsto per venerdì, spiegando perché è utile. Scrivi il prompt che daresti all'AI usando Contesto, Ruolo, Formato e Vincoli!"
      },
      {
        level: 3, levelName: "3° Liv · Mettiti alla prova!", type: "tip",
        isFinal: true,
        text: "<strong>Complimenti! 🎉</strong><br/><br/>Hai concluso con successo questo percorso formativo sull'uso efficace e sicuro dell'Intelligenza Artificiale al lavoro.<br/><br/>Ma la sfida continua... Porta le competenze che hai acquisito nelle tue attività quotidiane e ricorda che l'AI dà il meglio solo quando a guidarla c'è il tuo <strong>pensiero critico</strong>!"
      }
    ];

    let idx = 0;
    let introPage = 0;
    let score = 0;
    let lives = 3;
    let currentGuess = [];
    let currentSeq = [];

    document.getElementById("jumpSelect").onchange = (e) => {
      idx = parseInt(e.target.value, 10);
      introPage = 0;
      render();
    };

    function updateHeader() {
      const b = blocks[idx];
      document.getElementById("levelBadge").textContent = b.levelName;
      document.getElementById("scoreDisplay").textContent = `⭐ ${score} pt`;
      document.getElementById("livesDisplay").textContent = b.level === 3 ? "❤️".repeat(Math.max(0, lives)) : "";
      const pct = Math.round((idx / (blocks.length - 1)) * 100);
      document.getElementById("progressBar").style.width = `${pct}%`;
    }

    function nextBlock() {
      if (idx < blocks.length - 1) {
        idx++;
        render();
      }
    }

    function loseLife() {
      if (blocks[idx].level === 3 && lives > 0) {
        lives--;
        updateHeader();
      }
    }

    function render() {
      updateHeader();
      const screen = document.getElementById("screen");
      const b = blocks[idx];

      if (b.type === "intro") {
        screen.innerHTML = `
          <div>
            <span class="type-tag">Introduzione • Pagina ${introPage + 1} di ${b.pages.length}</span>
            <div class="hero-ill">🚀</div>
            <div class="card-box"><p>${b.pages[introPage]}</p></div>
          </div>
          <button class="btn" id="introNextBtn">${introPage < b.pages.length - 1 ? "Continua →" : "Inizia il percorso! 🎮"}</button>
        `;
        document.getElementById("introNextBtn").onclick = () => {
          if (introPage < b.pages.length - 1) {
            introPage++;
            render();
          } else {
            nextBlock();
          }
        };
        return;
      }

      if (b.type === "media" || b.type === "tip") {
        screen.innerHTML = `
          <div>
            <span class="type-tag">Blocco ${idx} di 28 • ${b.type === "media" ? "Media & Concetto" : "Testo Informativo"}</span>
            ${b.icon ? `<div class="hero-ill">${b.icon}</div>` : ""}
            <div class="card-box"><p>${b.text}</p></div>
          </div>
          <button class="btn" id="nextBtn">${b.isFinal ? "Ricomincia il Percorso 🔄" : "Continua →"}</button>
        `;
        document.getElementById("nextBtn").onclick = () => {
          if (b.isFinal) {
            idx = 0; introPage = 0; score = 0; lives = 3;
            render();
          } else {
            nextBlock();
          }
        };
        return;
      }

      if (b.type === "guess-the-word" || b.type === "squares") {
        const letters = (b.answer + (b.distractors || "")).split("").sort(() => Math.random() - 0.5);
        currentGuess = [];
        screen.innerHTML = `
          <div>
            <span class="type-tag">Blocco ${idx} di 28 • ${b.type === "squares" ? "Squares (Trova la Parola)" : "Indovina la Parola"}</span>
            <h2>${b.question}</h2>
            <div class="letter-slots" id="slots"></div>
            <div class="letter-bank" id="bank"></div>
            <div id="fbArea"></div>
          </div>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-secondary" id="resetWordBtn">Cancella</button>
            <button class="btn" id="checkWordBtn">Conferma</button>
          </div>
        `;
        const slotsEl = document.getElementById("slots");
        const bankEl = document.getElementById("bank");

        function updateWordUI() {
          slotsEl.innerHTML = Array.from({ length: b.answer.length }).map((_, i) =>
            `<div class="slot">${currentGuess[i] ? currentGuess[i].char : ""}</div>`
          ).join("");
        }
        letters.forEach((ch) => {
          const tile = document.createElement("div");
          tile.className = "tile";
          tile.textContent = ch;
          tile.onclick = () => {
            if (currentGuess.length < b.answer.length) {
              currentGuess.push({ char: ch, el: tile });
              tile.classList.add("used");
              updateWordUI();
            }
          };
          bankEl.appendChild(tile);
        });
        updateWordUI();

        document.getElementById("resetWordBtn").onclick = () => {
          currentGuess.forEach(item => item.el.classList.remove("used"));
          currentGuess = [];
          updateWordUI();
        };

        document.getElementById("checkWordBtn").onclick = () => {
          const word = currentGuess.map(x => x.char).join("");
          const isOk = word === b.answer;
          if (isOk) score += 80; else loseLife();
          updateHeader();
          document.getElementById("fbArea").innerHTML = `
            <div class="feedback-box ${isOk ? "feedback-ok" : "feedback-err"}">
              <strong>${isOk ? "✅ Esatto!" : `💡 Risposta corretta: ${b.answer}`}</strong><br/>${b.feedback}
            </div>
          `;
          const btn = document.getElementById("checkWordBtn");
          btn.textContent = "Avanti →";
          btn.onclick = nextBlock;
        };
        return;
      }

      if (b.type === "timeline") {
        currentSeq = b.items.map((text, origIdx) => ({ text, origIdx })).sort(() => Math.random() - 0.5);
        screen.innerHTML = `
          <div>
            <span class="type-tag">Blocco ${idx} di 28 • Sequenze</span>
            <h2>${b.question}</h2>
            <div id="seqList"></div>
            <div id="fbArea"></div>
          </div>
          <button class="btn" id="checkSeqBtn">Verifica Sequenza</button>
        `;
        const listEl = document.getElementById("seqList");
        function renderSeq() {
          listEl.innerHTML = "";
          currentSeq.forEach((item, i) => {
            const row = document.createElement("div");
            row.className = "seq-item";
            row.innerHTML = `
              <span><strong>${i + 1}.</strong> ${item.text}</span>
              <div class="seq-controls">
                <button ${i === 0 ? "disabled" : ""} data-dir="-1">↑</button>
                <button ${i === currentSeq.length - 1 ? "disabled" : ""} data-dir="1">↓</button>
              </div>
            `;
            row.querySelectorAll("button").forEach(btn => {
              btn.onclick = () => {
                const dir = parseInt(btn.getAttribute("data-dir"), 10);
                const target = i + dir;
                const tmp = currentSeq[i];
                currentSeq[i] = currentSeq[target];
                currentSeq[target] = tmp;
                renderSeq();
              };
            });
            listEl.appendChild(row);
          });
        }
        renderSeq();
        document.getElementById("checkSeqBtn").onclick = () => {
          const isOk = currentSeq.every((it, i) => it.origIdx === i);
          if (isOk) score += 100;
          updateHeader();
          document.getElementById("fbArea").innerHTML = `
            <div class="feedback-box ${isOk ? "feedback-ok" : "feedback-err"}">
              <strong>${isOk ? "✅ Sequenza perfetta!" : "💡 Ecco la sequenza corretta:"}</strong><br/>${b.feedback}
            </div>
          `;
          const btn = document.getElementById("checkSeqBtn");
          btn.textContent = "Avanti →";
          btn.onclick = nextBlock;
        };
        return;
      }

      if (b.type === "survey-quiz") {
        screen.innerHTML = `
          <div>
            <span class="type-tag">Blocco ${idx} di 28 • Sondaggio</span>
            <h2>${b.question}</h2>
            <div id="optList" style="margin-top:12px;"></div>
          </div>
          <div></div>
        `;
        const optList = document.getElementById("optList");
        b.options.forEach(opt => {
          const btn = document.createElement("button");
          btn.className = "btn btn-outline";
          btn.textContent = opt;
          btn.onclick = nextBlock;
          optList.appendChild(btn);
        });
        return;
      }

      if (b.type === "tinder") {
        screen.innerHTML = `
          <div>
            <span class="type-tag">Blocco ${idx} di 28 • Vero o Falso</span>
            <div class="card-box"><p>${b.question}</p></div>
            <div id="fbArea"></div>
          </div>
          <div id="actionArea" class="tinder-row">
            <button class="btn btn-true" id="btnTrue">VERO</button>
            <button class="btn btn-false" id="btnFalse">FALSO</button>
          </div>
        `;
        function answerTinder(val) {
          const isOk = val === b.correct;
          if (isOk) score += 75; else loseLife();
          updateHeader();
          document.getElementById("fbArea").innerHTML = `
            <div class="feedback-box ${isOk ? "feedback-ok" : "feedback-err"}">
              <strong>${isOk ? "✅ Risposta corretta!" : "❌ Attenzione!"}</strong><br/>${b.feedback}
            </div>
          `;
          const act = document.getElementById("actionArea");
          act.className = "";
          act.innerHTML = `<button class="btn" id="nextTinderBtn">Continua →</button>`;
          document.getElementById("nextTinderBtn").onclick = nextBlock;
        }
        document.getElementById("btnTrue").onclick = () => answerTinder(true);
        document.getElementById("btnFalse").onclick = () => answerTinder(false);
        return;
      }

      if (b.type === "crosswords") {
        screen.innerHTML = `
          <div>
            <span class="type-tag">Blocco ${idx} di 28 • Cruciverba</span>
            <h2>Completa le 5 parole chiave del percorso:</h2>
            <div id="cwList" style="margin-top:8px;"></div>
            <div id="fbArea"></div>
          </div>
          <button class="btn" id="checkCwBtn">Verifica Cruciverba</button>
        `;
        const cwList = document.getElementById("cwList");
        b.clues.forEach((c, i) => {
          const d = document.createElement("div");
          d.className = "cw-row";
          d.innerHTML = `<p style="font-size:0.8rem;">${c.q}</p><input type="text" data-idx="${i}" placeholder="${c.a[0]}..." maxlength="${c.a.length}" />`;
          cwList.appendChild(d);
        });
        document.getElementById("checkCwBtn").onclick = () => {
          const inputs = cwList.querySelectorAll("input");
          let correctCount = 0;
          inputs.forEach((inp, i) => {
            if (inp.value.trim().toUpperCase() === b.clues[i].a) {
              correctCount++;
              inp.style.borderColor = "#10b981";
            } else {
              inp.value = b.clues[i].a;
              inp.style.borderColor = "#eab308";
            }
          });
          score += correctCount * 20;
          if (correctCount < 3) loseLife();
          updateHeader();
          document.getElementById("fbArea").innerHTML = `
            <div class="feedback-box feedback-ok">
              <strong>Parole completate: ${correctCount}/5</strong><br/>${b.feedback}
            </div>
          `;
          const btn = document.getElementById("checkCwBtn");
          btn.textContent = "Avanti →";
          btn.onclick = nextBlock;
        };
        return;
      }

      if (b.type === "scenario") {
        screen.innerHTML = `
          <div>
            <span class="type-tag">Blocco ${idx} di 28 • Scenario Decisionale</span>
            <div class="card-box" style="margin-bottom:12px;"><p>${b.context}</p></div>
            <div id="scenOpts"></div>
            <div id="fbArea"></div>
          </div>
          <div id="scenNext"></div>
        `;
        const optsEl = document.getElementById("scenOpts");
        b.options.forEach((opt, i) => {
          const btn = document.createElement("button");
          btn.className = "btn btn-outline";
          btn.textContent = opt;
          btn.onclick = () => {
            const isOk = i === b.correctIndex;
            if (isOk) score += 100; else loseLife();
            updateHeader();
            optsEl.style.display = "none";
            document.getElementById("fbArea").innerHTML = `
              <div class="feedback-box ${isOk ? "feedback-ok" : "feedback-err"}">
                <strong>${isOk ? "✅ Scelta ottimale!" : "❌ Scelta rischiosa!"}</strong><br/>${b.feedback}
              </div>
            `;
            document.getElementById("scenNext").innerHTML = `<button class="btn" id="scenContBtn">Continua →</button>`;
            document.getElementById("scenContBtn").onclick = nextBlock;
          };
          optsEl.appendChild(btn);
        });
        return;
      }

      if (b.type === "open-ai") {
        screen.innerHTML = `
          <div>
            <span class="type-tag">Blocco ${idx} di 28 • Domanda Aperta (AI)</span>
            <h2>${b.question}</h2>
            <textarea id="promptInput" placeholder="Scrivi qui il tuo prompt usando Contesto, Ruolo, Formato e Vincoli..."></textarea>
            <div id="fbArea"></div>
          </div>
          <button class="btn" id="evalAiBtn">Valuta il Prompt ✨</button>
        `;
        document.getElementById("evalAiBtn").onclick = () => {
          const val = document.getElementById("promptInput").value.trim().toLowerCase();
          if (val.length < 15) {
            alert("Scrivi un prompt di almeno una frase completa prima di inviare!");
            return;
          }
          const hasContext = /venerd|corso|aggiornamento|2 ore|team/.test(val);
          const hasRole = /agisci|ruolo|esperto|comunicazione|hr|formatore|manager/.test(val);
          const hasFormat = /mail|elenco|punti|oggetto|struttura|scaletta|paragraf/.test(val);
          const hasConstraint = /parole|tono|breve|motivante|non|evita|massimo|max/.test(val);
          const pillars = [hasContext, hasRole, hasFormat, hasConstraint].filter(Boolean).length;
          const grade = Math.min(10, 5 + pillars * 1.25);
          score += Math.round(grade * 10);
          updateHeader();
          document.getElementById("fbArea").innerHTML = `
            <div class="feedback-box feedback-ok">
              <strong>🤖 Valutazione Rubrica: ${Math.round(grade)}/10</strong><br/>
              • Contesto (corso venerdì/2h): ${hasContext ? "✅ Presente" : "⚠️ Da specificare"}<br/>
              • Ruolo assegnato all'AI: ${hasRole ? "✅ Presente" : "⚠️ Aggiungi 'Agisci come...'"}<br/>
              • Formato richiesto: ${hasFormat ? "✅ Presente" : "⚠️ Indica struttura (es. punti elenco)"}<br/>
              • Vincoli (tono/lunghezza): ${hasConstraint ? "✅ Presente" : "⚠️ Indica tono e limite di parole"}
            </div>
          `;
          const btn = document.getElementById("evalAiBtn");
          btn.textContent = "Concludi il percorso →";
          btn.onclick = nextBlock;
        };
      }
    }

    render();
  </script>
</body>
</html>
